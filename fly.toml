app = 'elmo'
primary_region = 'ord'

[build]
  image = 'ghcr.io/gcca/elmo:latest'

[env]
  TZ = 'UTC'

[[mounts]]
  source = 'elmo_data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    method = 'GET'
    path = '/healthcheck'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
